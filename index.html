<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>E-Commerce UI Project</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#e3e6e6;
}


.navbar{
    height:60px;
    background:#131921;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-evenly;
}

.logo{
    width:120px;
    height:50px;
    background:url('https://pngimg.com/uploads/amazon/amazon_PNG11.png');
    background-size:contain;
    background-repeat:no-repeat;
    background-position:center;
}

.border{
    border:1px solid transparent;
    padding:5px;
}

.border:hover{
    border:1px solid white;
    cursor:pointer;
}

.address1{
    color:#ccc;
    font-size:12px;
}

.address2{
    font-size:14px;
    font-weight:bold;
}

.search{
    display:flex;
    width:50%;
    height:40px;
    border-radius:5px;
    overflow:hidden;
}

.search select{
    width:55px;
    border:none;
    background:#f3f3f3;
    padding-left:5px;
}

.search input{
    width:100%;
    border:none;
    padding-left:10px;
    font-size:15px;
}

.search button{
    width:50px;
    border:none;
    background:#febd69;
    font-size:18px;
}

.nav-text small{
    font-size:12px;
}

.nav-text p{
    font-size:14px;
    font-weight:bold;
}

.cart{
    display:flex;
    align-items:center;
    gap:5px;
    font-weight:bold;
}

.cart i{
    font-size:28px;
}


.panel{
    height:40px;
    background:#232f3e;
    color:white;
    display:flex;
    align-items:center;
    gap:20px;
    padding-left:20px;
    font-size:14px;
}


.hero{
    height:350px;
    background:url('https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=1600&auto=format&fit=crop');
    background-size:cover;
    background-position:center;
}



.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:25px;
}

.box{
    background:white;
    padding:20px;
    border-radius:10px;
    transition:0.3s;
}

.box:hover{
    transform:translateY(-5px);
}

.box h2{
    margin-bottom:15px;
    font-size:22px;
}

.box img{
    width:100%;
    height:250px;
    object-fit:cover;
    border-radius:8px;
}

.price{
    color:#b12704;
    font-size:20px;
    margin:10px 0;
    font-weight:bold;
}

.btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:30px;
    background:#ffd814;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:#f7ca00;
}



.footer{
    background:#131921;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:20px;
}

@media(max-width:768px){

    .search{
        width:40%;
    }

    .nav-text{
        display:none;
    }

    .panel{
        overflow:auto;
        white-space:nowrap;
    }

}

</style>
</head>

<body>

<div class="navbar">

    <div class="logo border"></div>

    <div class="border">
        <div class="address1">Deliver to</div>
        <div class="address2">
            <i class="fa-solid fa-location-dot"></i>
            India
        </div>
    </div>

    <div class="search">
        <select>
            <option>All</option>
        </select>

        <input type="text" placeholder="Search Amazon Clone">

        <button>
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>
    </div>

    <div class="nav-text border">
        <small>Hello, Sign in</small>
        <p>Account & Lists</p>
    </div>

    <div class="nav-text border">
        <small>Returns</small>
        <p>& Orders</p>
    </div>

    <div class="cart border">
        <i class="fa-solid fa-cart-shopping"></i>
        Cart
    </div>

</div>


<div class="panel">
    <p><i class="fa-solid fa-bars"></i> All</p>
    <p>Today's Deals</p>
    <p>Customer Service</p>
    <p>Electronics</p>
    <p>Fashion</p>
    <p>Mobiles</p>
    <p>Books</p>
</div>



<div class="hero"></div>


<div class="products">

    <div class="box">
        <h2>Headphones</h2>
        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?q=80&w=1200&auto=format&fit=crop">
        <div class="price">₹1,999</div>
        <button class="btn">Add to Cart</button>
    </div>

    <div class="box">
        <h2>Smart Watch</h2>
        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=1200&auto=format&fit=crop">
        <div class="price">₹2,499</div>
        <button class="btn">Add to Cart</button>
    </div>

    <div class="box">
        <h2>Shoes</h2>
        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=1200&auto=format&fit=crop">
        <div class="price">₹3,299</div>
        <button class="btn">Add to Cart</button>
    </div>

    <div class="box">
        <h2>Laptop</h2>
        <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?q=80&w=1200&auto=format&fit=crop">
        <div class="price">₹59,999</div>
        <button class="btn">Add to Cart</button>
    </div>

</div>


<div class="footer">
    <p>© 2026 Amazon Clone | Designed in HTML CSS</p>
</div>

</body>
</html>
